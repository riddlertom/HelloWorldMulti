name: Deploy to Vercel

# Triggers Vercel to redeploy when we push to main.
# Add VERCEL_DEPLOY_HOOK secret - see README for setup instructions.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
