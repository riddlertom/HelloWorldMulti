name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      skip_build:
        description: 'Skip EAS build (use latest existing builds)'
        required: false
        default: false
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Android credentials
        run: |
          mkdir -p android/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystores/release.keystore
          echo "${{ secrets.ANDROID_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json

      - name: Run EAS Build (Android - AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
        run: |
          eas build --platform android --profile production --non-interactive
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'

      - name: Run EAS Build (Android - APK)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
        run: |
          eas build --platform android --profile preview --non-interactive
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch build artifacts
        id: artifacts
        run: |
          # Get production build (AAB)
          PROD_JSON=$(eas build:list --platform android --build-profile production --limit 1 --status finished --json --non-interactive)
          AAB_URL=$(echo "$PROD_JSON" | jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
          
          # Get preview build (APK)
          PREVIEW_JSON=$(eas build:list --platform android --build-profile preview --limit 1 --status finished --json --non-interactive)
          APK_URL=$(echo "$PREVIEW_JSON" | jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
          
          echo "aab_url=$AAB_URL" >> $GITHUB_OUTPUT
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          
          if [ -z "$AAB_URL" ]; then
            echo "No production Android build found"
            exit 1
          fi

      - name: Download artifacts
        run: |
          mkdir -p artifacts
          curl -L -o artifacts/app-release.aab "${{ steps.artifacts.outputs.aab_url }}"
          if [ -n "${{ steps.artifacts.outputs.apk_url }}" ]; then
            curl -L -o artifacts/app-release.apk "${{ steps.artifacts.outputs.apk_url }}"
          fi
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
