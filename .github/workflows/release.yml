name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      skip_build:
        description: 'Skip EAS build (use latest existing builds)'
        required: false
        default: false
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Android credentials
        run: |
          mkdir -p android/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystores/release.keystore
          echo "${{ secrets.ANDROID_CREDENTIALS_BASE64 }}" | base64 -d > credentials.json

      - name: Run EAS Build (Android)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
        run: |
          eas build --platform android --profile production --non-interactive
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch build artifacts
        id: artifacts
        run: |
          # Get latest Android build
          ANDROID_JSON=$(eas build:list --platform android --limit 1 --status finished --json --non-interactive)
          ANDROID_URL=$(echo "$ANDROID_JSON" | jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
          
          # Get latest iOS build (if exists)
          IOS_JSON=$(eas build:list --platform ios --limit 1 --status finished --json --non-interactive 2>/dev/null || echo "null")
          IOS_URL=$(echo "$IOS_JSON" | jq -r 'if . == null or . == "" then empty elif type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' 2>/dev/null || echo "")
          
          echo "android_url=$ANDROID_URL" >> $GITHUB_OUTPUT
          echo "ios_url=$IOS_URL" >> $GITHUB_OUTPUT
          
          if [ -z "$ANDROID_URL" ]; then
            echo "No Android build found"
            exit 1
          fi

      - name: Download artifacts
        run: |
          mkdir -p artifacts
          curl -L -o artifacts/app-release.aab "${{ steps.artifacts.outputs.android_url }}"
          if [ -n "${{ steps.artifacts.outputs.ios_url }}" ]; then
            curl -L -o artifacts/app-release.ipa "${{ steps.artifacts.outputs.ios_url }}"
          fi
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
